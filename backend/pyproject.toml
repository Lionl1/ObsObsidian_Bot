[project]
name = "telegram-obsidian-bot"
version = "0.1.0"
description = "Private Telegram bot for article parsing and Obsidian note generation with conversational memory."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.15.0,<4.0.0",
    "openai>=1.51.0,<2.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "trafilatura>=2.0.0,<3.0.0",
    "pypdf>=4.0.0,<5.0.0",
]

[tool.uv]
package = false
